<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CSS en Línea</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      margin: 0;
      padding: 20px;
    "
  >
    <header
      style="
        border-bottom: 2px solid #0d47a1;
        padding-bottom: 10px;
        margin-bottom: 20px;
      "
    >
      <h1 style="color: #0d47a1; margin-bottom: 0.25rem; margin-top: 0">
        Taller DIW: CSS en Línea
      </h1>
      <p style="color: #555; margin: 0">
        Estilos aplicados directamente en los elementos
      </p>
    </header>

    <main>
      <div
        style="
          border: 1px solid #ccc;
          padding: 1rem;
          border-radius: 8px;
          background: #fff;
          margin-bottom: 1rem;
        "
      >
        <h2 style="color: #1b5e20; margin-top: 0">Destacado</h2>
        <p style="color: #555">Aplicación de estilos etiqueta por etiqueta.</p>
        <a
          href="#"
          style="
            display: inline-block;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border: 1px solid #1b5e20;
            color: #1b5e20;
            border-radius: 4px;
          "
          >Botón</a
        >
      </div>

      <div
        style="
          border: 1px solid #ccc;
          padding: 1rem;
          border-radius: 8px;
          background: #fff;
        "
      >
        <h2 style="color: #1b5e20; margin-top: 0">Lista</h2>
        <ul style="margin-bottom: 0; padding-left: 20px">
          <li style="font-weight: bold; color: #555">Item A</li>
          <li style="color: #c62828">Item B</li>
        </ul>
      </div>
    </main>
  </body>
</html>
